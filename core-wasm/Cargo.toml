[package]
name = "obsink-core-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings over the pure half of obsink-core for the browser client"

# `cdylib` is what wasm-pack turns into the .wasm + JS glue; `rlib` lets the
# integration tests and the native `cargo test` link the same code.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obsink-core = { path = "../core" }
# The only bridge to JS: exports the functions below and marshals bytes/strings.
wasm-bindgen = "0.2"
# Manifests, diffs, plans and choices cross the boundary as JSON strings
# (already a core dependency; no extra serialisation layer).
serde_json = "1"
# Wipes the account key on drop, as core does for its sub-keys (same crate core uses).
zeroize = "1"

[dev-dependencies]
# Runs the same tests inside a wasm runtime (`wasm-pack test --node`).
wasm-bindgen-test = "0.3"
