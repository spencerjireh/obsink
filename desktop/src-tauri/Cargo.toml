[package]
name = "obsink-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
hex = "0.4"
obsink-core = { path = "../../core", features = ["keychain"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

# tokio: the daemon's event channel (Tauri's async runtime is tokio); the
# ignored live integration test drives the async commands with it too.
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "sync"] }
