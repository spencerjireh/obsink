name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The server every release build talks to (compile-time `option_env!` in the
  # desktop shell; the CLI takes it per command).
  OBSINK_SERVER_URL: https://obsink-api.spencerjireh.com

jobs:
  verify-version:
    name: verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml, package.json, and tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml)
          pkg=$(jq -r .version desktop/package.json)
          tauri=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          echo "tag=$tag Cargo.toml=$cargo package.json=$pkg tauri.conf.json=$tauri"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$tauri" ]; then
            echo "::error::version mismatch: tag v$tag, Cargo.toml $cargo, package.json $pkg, tauri.conf.json $tauri"
            exit 1
          fi

  # The CLI as one universal Mach-O (Apple Silicon + Intel), Developer ID
  # signed with the hardened runtime so Gatekeeper is content wherever the
  # binary ends up (a tarball itself is never notarized).
  cli-macos-universal:
    name: CLI (universal-apple-darwin)
    needs: verify-version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain plus both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the CLI for both architectures (keychain enabled through obsink-core)
        run: |
          cargo build --release -p obsink --locked --target aarch64-apple-darwin
          cargo build --release -p obsink --locked --target x86_64-apple-darwin
      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci-import-signing-cert.sh
      - name: Lipo, sign, smoke test, package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          mkdir -p dist
          lipo -create -output dist/obsink \
            target/aarch64-apple-darwin/release/obsink \
            target/x86_64-apple-darwin/release/obsink
          lipo -info dist/obsink | grep -q "x86_64 arm64"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp dist/obsink
          codesign --verify --verbose=2 dist/obsink
          [ "$(dist/obsink --version)" = "obsink ${GITHUB_REF_NAME#v}" ]
          name="obsink-${GITHUB_REF_NAME}-universal-apple-darwin"
          tar -C dist -czf "dist/${name}.tar.gz" obsink
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" && cat "${name}.tar.gz.sha256")
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/obsink-${{ github.ref_name }}-universal-apple-darwin.tar.gz
            dist/obsink-${{ github.ref_name }}-universal-apple-darwin.tar.gz.sha256

  # The desktop app as a universal DMG, signed and notarized by Tauri's
  # bundler (it reads APPLE_CERTIFICATE*, APPLE_SIGNING_IDENTITY and the
  # App Store Connect API key from the environment and staples the ticket).
  desktop-macos-universal:
    name: Desktop (universal DMG)
    needs: verify-version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain plus both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the npm workspaces
        run: npm ci
      - name: Write the App Store Connect API key for notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize the universal app and DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run tauri -w desktop -- build --target universal-apple-darwin
      - name: Verify the signature, rename, checksum
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          mkdir -p dist
          cp "$dmg" "dist/ObSink-${GITHUB_REF_NAME}-universal.dmg"
          (cd dist && shasum -a 256 "ObSink-${GITHUB_REF_NAME}-universal.dmg" > "ObSink-${GITHUB_REF_NAME}-universal.dmg.sha256" && cat "ObSink-${GITHUB_REF_NAME}-universal.dmg.sha256")
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ObSink-${{ github.ref_name }}-universal.dmg
            dist/ObSink-${{ github.ref_name }}-universal.dmg.sha256
