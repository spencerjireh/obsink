name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  commits:
    name: commits
    # Only meaningful on a PR; a job skipped by `if:` still satisfies the ruleset.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit message in the PR range
        run: scripts/check-commit-msg.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  core:
    name: core + CLI + mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (all crates except the Tauri shell, which is linted on macOS)
        run: cargo clippy -p obsink-core -p obsink-core-wasm -p obsink -p obsink-mobile -p obsink-server --all-targets -- -D warnings
      - name: Test core, the wasm bindings (natively), CLI, and mobile facade
        run: cargo test -p obsink-core -p obsink-core-wasm -p obsink -p obsink-mobile

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  server:
    name: server (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      OBSINK_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test server against Postgres
        run: cargo test -p obsink-server
      - name: Build server image
        run: docker build -f server/Dockerfile .

  web:
    name: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The dev server still sends the sign-in email; Mailpit catches it.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            e2e:
              - 'web/**'
              - 'ui/**'
              - 'site/**'
              - 'core/**'
              - 'core-wasm/**'
              - 'server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package-lock.json'
              - 'scripts/verify-web-e2e.mjs'
              - '.github/workflows/ci.yml'
      - name: Install the pinned Rust toolchain (rust-toolchain.toml, with wasm32)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack (cached in ~/.cargo/bin by rust-cache)
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked --version 0.15.0
      - name: Build the core for the browser
        run: wasm-pack build core-wasm --target web
      - name: Test the bindings inside a wasm runtime
        run: wasm-pack test --node --release core-wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the npm workspaces (ui, desktop, web)
        run: npm ci
      - name: Type-check, test and build the browser client
        run: npm run typecheck -w web && npm run test -w web && npm run build -w web
      - name: Build the web image (site, client, API proxy)
        run: docker build -f web/Dockerfile -t obsink-web:ci .
      - name: Check the Caddyfile, the site and the image's routes
        run: OBSINK_WEB_IMAGE=obsink-web:ci scripts/test-web-container.sh
      - name: Both compose files parse
        run: |
          docker compose -f docker-compose.yml config --quiet
          POSTGRES_PASSWORD=x OBSINK_SERVER_KEY=x OBSINK_API_KEY=x SMTP_HOST=x SMTP_USERNAME=x SMTP_PASSWORD=x SMTP_FROM=x \
            docker compose -f docker-compose.coolify.yml config --quiet
      # The browser client end to end: the server from this checkout (debug
      # build, warm from rust-cache) behind the web image just built, so the
      # Caddy proxy is on the path, driven by the two-device harness.
      - name: Nothing the browser client depends on changed
        if: steps.filter.outputs.e2e != 'true'
        run: echo "No changes under web/, ui/, site/, core/, core-wasm/, server/; skipping the browser end-to-end run."
      - name: Build and start the server
        if: steps.filter.outputs.e2e == 'true'
        run: |
          cargo build -p obsink-server
          mkdir -p "$RUNNER_TEMP/obsink-data"
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
          OBSINK_LISTEN=0.0.0.0:8080 OBSINK_DATA_DIR="$RUNNER_TEMP/obsink-data" \
          OBSINK_API_KEY=ci-operator-key AUTH_DEV_RETURN_CODE=1 \
          SMTP_HOST=localhost SMTP_PORT=1025 SMTP_TLS=none SMTP_FROM="ObSink <login@obsink.local>" \
          RUST_LOG=obsink_server=info \
            nohup ./target/debug/obsink-server serve > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:8080/healthz 2>/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
      - name: Start the web image in front of it
        if: steps.filter.outputs.e2e == 'true'
        run: |
          docker run -d --name web --add-host=server:host-gateway -p 8081:80 obsink-web:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8081/healthz 2>/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8081/healthz
      - name: Install Chromium for Playwright
        if: steps.filter.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser client end to end (two devices, conflict, Keep both)
        if: steps.filter.outputs.e2e == 'true'
        env:
          OBSINK_WEB_URL: http://localhost:8081/app/
          OBSINK_SERVER_URL: http://localhost:8081
          OBSINK_API_KEY: ci-operator-key
        run: node scripts/verify-web-e2e.mjs
      - name: Server and web logs
        if: always() && steps.filter.outputs.e2e == 'true'
        run: |
          echo "::group::server"; tail -n 200 "$RUNNER_TEMP/server.log" || true; echo "::endgroup::"
          echo "::group::web"; docker logs web 2>&1 | tail -n 100 || true; echo "::endgroup::"

  desktop:
    name: desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the npm workspaces (ui, desktop)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check the shared UI package
        run: npm run typecheck -w ui
      - name: Build desktop frontend
        run: npm run build -w desktop
      - name: Clippy the Tauri shell and the CLI (macOS keychain path)
        run: cargo clippy -p obsink-desktop -p obsink --all-targets -- -D warnings
      - name: Install shellcheck (not on the macOS runner image)
        run: brew install shellcheck
      - name: Lint the shell scripts (install.sh and the test scripts strictly, the rest for errors)
        run: |
          shellcheck -s sh site/install.sh
          shellcheck scripts/test-*.sh
          shellcheck -S error scripts/*.sh
      - name: Test install.sh against a fake release (macOS only, like the script)
        run: scripts/test-install-sh.sh

  ios:
    name: ios (simulator)
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'mobile/**'
              - 'core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/build-ios.sh'
              - '.github/workflows/ci.yml'
      - name: Nothing iOS-related changed
        if: steps.filter.outputs.ios != 'true'
        run: echo "No changes under ios/, mobile/, core/, Cargo.lock; skipping the simulator build."
      - name: Install the pinned Rust toolchain + simulator target
        if: steps.filter.outputs.ios == 'true'
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.filter.outputs.ios == 'true'
      - name: Install XcodeGen
        if: steps.filter.outputs.ios == 'true'
        run: brew install xcodegen
      - name: Build the simulator xcframework, Swift bindings, and Xcode project
        if: steps.filter.outputs.ios == 'true'
        run: scripts/build-ios.sh --simulator-only
      - name: Pick and boot a simulator
        if: steps.filter.outputs.ios == 'true'
        id: sim
        run: |
          udid=$(xcrun simctl list -j devices available \
            | jq -r '[.devices[][] | select(.isAvailable and (.name | test("^iPhone [0-9]+( Pro)?$")))] | sort_by((.name | capture("(?<n>[0-9]+)").n | tonumber), .name) | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::no iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run ObSinkTests (ObSinkUITests need a live server and are excluded)
        if: steps.filter.outputs.ios == 'true'
        run: |
          xcodebuild test \
            -project ios/ObSink.xcodeproj -scheme ObSink \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:ObSinkTests \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO
