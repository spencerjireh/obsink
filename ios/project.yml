name: ObSink
options:
  bundleIdPrefix: com.obsink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Rust staticlib needs these system libs (reqwest proxy detection + resolver).
    OTHER_LDFLAGS:
      - -lresolv
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  ObSink:
    type: application
    platform: iOS
    sources:
      - path: ObSink
      - path: DB
      - path: Generated/obsink_mobile.swift
    dependencies:
      - framework: Frameworks/ObSinkMobile.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: FileProvider.framework
      - target: FileProviderExt
        embed: true
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsink.ios
        INFOPLIST_FILE: ObSink/Info.plist
        CODE_SIGN_ENTITLEMENTS: ObSink/ObSink.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  FileProviderExt:
    type: app-extension
    platform: iOS
    sources:
      - path: FileProvider
      - path: DB
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsink.ios.FileProvider
        INFOPLIST_FILE: FileProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements

  ObSinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: DB
      - path: FileProvider
    dependencies:
      - target: ObSink
      - package: GRDB
      - sdk: FileProvider.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsink.ios.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ObSink:
    build:
      targets:
        ObSink: all
        ObSinkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ObSinkTests
