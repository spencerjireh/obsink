name: ObSink
options:
  bundleIdPrefix: com.obsink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Rust staticlib needs these system libs (reqwest proxy detection + resolver).
    OTHER_LDFLAGS:
      - -lresolv
    # The Rust xcframework ships an arm64-only simulator slice.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # Resolved by XcodeGen from the environment at generate time (see
    # scripts/build-ios.sh, which loads it from the gitignored .env). Empty is
    # fine for simulator builds (CODE_SIGNING_ALLOWED=NO); device/TestFlight
    # builds need DEVELOPMENT_TEAM set before regenerating the project.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  ObSink:
    type: application
    platform: iOS
    sources:
      - path: ObSink
      - path: DB
      - path: Generated/obsink_mobile.swift
    dependencies:
      - framework: Frameworks/ObSinkMobile.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: FileProvider.framework
      - target: FileProviderExt
        embed: true
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsink.ios
        INFOPLIST_FILE: ObSink/Info.plist
        CODE_SIGN_ENTITLEMENTS: ObSink/ObSink.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Debug adds the File Provider testing-mode entitlement so simulator
        # runs can force-enable the domain (see SyncModel.registerFileProviderDomain).
        Debug:
          CODE_SIGN_ENTITLEMENTS: ObSink/ObSinkDebug.entitlements

  FileProviderExt:
    type: app-extension
    platform: iOS
    sources:
      - path: FileProvider
      - path: DB
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsink.ios.FileProvider
        INFOPLIST_FILE: FileProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements
        # Xcode's debug-dylib stub breaks NSExtension principal-class loading
        # for the File Provider appex (extension launches, class never
        # instantiated). Link the extension normally in all configs.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: FileProvider/FileProviderDebug.entitlements

  ObSinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: DB
      - path: FileProvider
      - path: ObSink/KeychainStore.swift
    dependencies:
      - target: ObSink
      - package: GRDB
      - sdk: FileProvider.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsink.ios.Tests
        GENERATE_INFOPLIST_FILE: YES

  ObSinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ObSink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsink.ios.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ObSink

schemes:
  ObSink:
    build:
      targets:
        ObSink: all
        ObSinkTests: [test]
        ObSinkUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ObSinkTests
        - ObSinkUITests
