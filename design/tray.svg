<?xml version="1.0" encoding="UTF-8"?>
<!--
  ObSink menu-bar silhouette. macOS renders it as a template image (tinted to
  the menu-bar colour) at 18 pt, so it is black on transparent and the ring
  is heavier than in icon.svg. scripts/gen-icons.sh rasterises it to
  desktop/src-tauri/icons/tray.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g fill="none" stroke="#000000" stroke-width="110" stroke-linecap="round">
    <path d="M180 420A340 340 0 0 1 844 420"/>
    <path d="M844 604A340 340 0 0 1 180 604"/>
  </g>
  <circle cx="512" cy="512" r="150" fill="#000000"/>
</svg>
