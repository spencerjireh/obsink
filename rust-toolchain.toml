# Single source of truth for the Rust version. rustup reads it locally, in CI
# (`rustup toolchain install` with no arguments), and inside the cargo-deny container.
# Keep server/Dockerfile's `rust:1.97-bookworm` tag on the same minor when bumping
# (the file is .dockerignore'd so Docker builds use the image's own toolchain).
# iOS and x86_64 macOS targets are installed by the scripts and release jobs that
# need them (`rustup target add`), not here, so the Linux CI jobs do not download
# unused std libs. wasm32 is small and every job that builds `core-wasm` needs it.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
