<?xml version="1.0" encoding="UTF-8"?>
<!--
  ObSink mark: the clasp. Full-bleed 1024 viewBox; iOS uses it as-is,
  scripts/gen-icons.sh adds the macOS tile margin. Two arcs with rounded
  caps close a ring around a bone disc: two devices, one closed loop.
  Colours are the brand constants in DESIGN.md (ground, verdigris, bone).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#0F1613"/>
  <g fill="none" stroke="#7FCBB8" stroke-width="72" stroke-linecap="round">
    <path d="M232 442A290 290 0 0 1 792 442"/>
    <path d="M792 582A290 290 0 0 1 232 582"/>
  </g>
  <circle cx="512" cy="512" r="118" fill="#EDEEE9"/>
</svg>
