# Production stack for Coolify (or any compose host behind a TLS proxy).
# Coolify clones the repo and builds server/Dockerfile on the host (a Rust
# release build: several minutes on the first deploy, cached afterwards); a
# redeploy rebuilds from the current branch.
# Two services take a domain: `web` (the site, obsink.spencerjireh.com) and
# `server` (the API, obsink-api.spencerjireh.com). Both speak plain HTTP;
# Coolify's Traefik terminates TLS and routes each domain to its container.
# The `web` container also proxies the API paths on the site domain, so
# builds that bake the old host keep working. Set these in the Coolify
# environment:
#   OBSINK_SERVER_KEY   `obsink-server keygen` output; back it up
#   POSTGRES_PASSWORD   database password
#   SMTP_HOST/PORT/USERNAME/PASSWORD/FROM/TLS   for email sign-in
#   APPLE_CLIENT_IDS    default com.obsink.ios
# See docs/self-hosting.md.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # No host port; Coolify's Traefik reaches the container on 8080 (the
    # `expose` tells Coolify which port the domain routes to).
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://obsink:${POSTGRES_PASSWORD}@postgres:5432/obsink
      OBSINK_SERVER_KEY: ${OBSINK_SERVER_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-com.obsink.ios}
      MAX_VAULTS_PER_USER: ${MAX_VAULTS_PER_USER:-10}
      MAX_VAULT_BYTES: ${MAX_VAULT_BYTES:-1073741824}
      RUST_LOG: ${RUST_LOG:-obsink_server=info}
    volumes:
      - obsink-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "obsink-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The website: landing page, browser client at /app, and a reverse proxy
  # for the API paths (see web/Caddyfile). Assign the public site domain to
  # this service and the API domain to `server`; both build from the branch.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obsink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: obsink
    volumes:
      - obsink-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsink -d obsink"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  obsink-data:
  obsink-pg:
