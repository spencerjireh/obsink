[package]
name = "obsink-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
# Stream combinators for bounded download concurrency; already in the tree via reqwest.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
walkdir = "2"
# Wipes the derived sub-keys on drop; already in the dependency tree via aes-gcm.
zeroize = "1"

# `keychain`: macOS login-keychain access for the CLI and desktop app, via the
# Security framework so secrets never travel on a `security` argv.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[features]
keychain = ["dep:security-framework"]

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
