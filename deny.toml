# cargo-deny policy. Locally: `cargo install cargo-deny && cargo deny check`.
# CI (`cargo deny` job): `cargo deny check advisories licenses bans sources`.

[graph]
# Platforms we ship: server (Linux in Docker), CLI + desktop (macOS universal), iOS device +
# simulator, and the browser client (core-wasm). Windows/Android-only transitive deps of
# Tauri are not evaluated.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Only unmaintained advisories on crates the workspace depends on directly fail the check;
# Tauri, UniFFI and httpmock pull unmaintained transitive crates we cannot replace ourselves.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa: Marvin timing side channel. Dev-dependency of obsink-server only (tests forge Apple identity tokens); never linked into a shipped binary; no fixed release exists." },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "0BSD",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  # notify (the daemon's filesystem watcher) is public domain.
  "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
