# Local development stack: the server built from this checkout, Postgres,
# and Mailpit (catches sign-in emails at http://localhost:8025).
#
#   docker compose up -d
#   OBSINK_SERVER_URL=http://localhost:8080 OBSINK_API_KEY=dev-operator-key scripts/verify-server-deploy.sh
#
# AUTH_DEV_RETURN_CODE=1 makes /auth/email/start return the code inline so
# harnesses can sign in without reading mail. Never set it in production.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: obsink-server:dev
    ports:
      - "${OBSINK_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://obsink:obsink@postgres:5432/obsink
      OBSINK_API_KEY: ${OBSINK_API_KEY:-dev-operator-key}
      OBSINK_SERVER_KEY: ${OBSINK_SERVER_KEY:-}
      AUTH_DEV_RETURN_CODE: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: "ObSink <login@obsink.local>"
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-com.obsink.ios}
      RUST_LOG: ${RUST_LOG:-obsink_server=info,tower_http=info}
    volumes:
      - obsink-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "obsink-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obsink
      POSTGRES_PASSWORD: obsink
      POSTGRES_DB: obsink
    volumes:
      - obsink-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsink -d obsink"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  obsink-data:
  obsink-pg:
